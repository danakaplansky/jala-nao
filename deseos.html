<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deseos para Nao y Nacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Pinyon+Script&display=swap">
<style>
  /* Muro de post-its: notas de papel fijas en una grilla que se scrollea; la más nueva arriba. */
  :root {
    --wine: #5A0F22; --deep: #3B0815; --pink: #F0A9BB; --blush: #F8D6DE; --cream: #F7EEE2; --gold: #C9A46A; --waxred: #8E1B32;
    --script: "Snell Roundhand", "Pinyon Script", cursive;
    --display: "Didot", "Bodoni Moda", "Bodoni 72", serif;
    --serif: "Futura", "Jost", "Century Gothic", sans-serif;
    --mono: "Futura", "Jost", "Century Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background-color: var(--wine);
    background-image:
      linear-gradient(45deg, #6B1529 25%, transparent 25%, transparent 75%, #6B1529 75%),
      linear-gradient(45deg, #6B1529 25%, transparent 25%, transparent 75%, #6B1529 75%);
    background-size: 120px 120px;
    background-position: 0 0, 60px 60px;
    background-attachment: fixed;
    color: var(--wine);
    font-family: var(--serif);
    padding: 24px 16px calc(110px + env(safe-area-inset-bottom, 0px));
  }
  header { display: flex; justify-content: center; margin-bottom: 28px; }
  .title {
    background: var(--cream); border-radius: 22px; padding: 14px 28px 18px;
    text-align: center; box-shadow: 0 16px 40px rgba(30, 3, 9, .45); position: relative;
  }
  .title::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid var(--wine); border-radius: 15px; opacity: .45; }
  .title p { margin: 0; font-family: var(--mono); font-weight: 500; letter-spacing: .3em; font-size: 11px; }
  .title h1 { margin: 6px 0 2px; font-size: clamp(38px, 9vw, 72px); }
  .title .count { font-family: var(--mono); font-weight: 500; letter-spacing: .2em; font-size: 11px; margin-top: 4px; }

  .wall {
    max-width: 1100px; margin: 0 auto;
    display: grid; gap: 22px 18px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    align-items: start;
  }
  @media (min-width: 700px) { .wall { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 30px 26px; } }

  .note {
    position: relative;
    padding: 30px 16px 18px;
    min-height: 150px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    box-shadow: 0 10px 18px rgba(30, 3, 9, .35), 0 2px 0 rgba(0, 0, 0, .05);
    transform: rotate(var(--r, 0deg));
  }
  .note::before { /* cinta */
    content: ""; position: absolute; top: -10px; left: 50%; width: 64px; height: 22px;
    transform: translateX(-50%) rotate(calc(var(--r, 0deg) * -2));
    background: rgba(247, 238, 226, .6);
    box-shadow: 0 1px 2px rgba(30, 3, 9, .15);
  }
  .note .wish { font-style: normal; font-weight: 500; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; margin: 0; }
  .note .who { font-family: var(--mono); font-weight: 500; letter-spacing: .16em; font-size: 11px; margin: 0; }
  .p1 { background: var(--pink); }
  .p2 { background: var(--cream); }
  .p3 { background: var(--blush); }
  .p4 { background: var(--waxred); color: var(--cream); }
  .p4 .who { color: var(--gold); }
  @media (min-width: 700px) { .note .wish { font-size: 19px; } }
  @media (prefers-reduced-motion: no-preference) {
    .note.new { animation: stick .7s cubic-bezier(.3, 1.5, .5, 1) both; }
    @keyframes stick { from { transform: rotate(var(--r, 0deg)) scale(1.35); opacity: 0; } to { transform: rotate(var(--r, 0deg)) scale(1); opacity: 1; } }
  }

  .empty { text-align: center; color: var(--cream); font-style: normal; font-size: 22px; margin: 40px auto; max-width: 320px; }

  .join {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6;
    display: flex; justify-content: center; gap: 10px;
  }
  .jbtn {
    flex: 0 1 220px; min-height: 52px; display: grid; place-items: center; padding: 10px 14px;
    border-radius: 999px; border: 1.5px solid var(--wine); background: var(--cream); color: var(--wine);
    font-family: var(--mono); font-weight: 500; font-size: 12.5px; letter-spacing: .12em; text-decoration: none;
    box-shadow: 0 12px 28px rgba(30, 3, 9, .45);
  }
  .jbtn.main { background: var(--pink); }
  .jbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .ttl { display: flex; flex-direction: column; align-items: center; margin: 0; line-height: .86; font-weight: 400; }
  .ttl span { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: -.01em; display: inline-block; transform: scaleX(.78); }
  .ttl em { font-family: var(--script); font-style: normal; font-weight: 700; font-size: .5em; transform: rotate(-6deg); margin: -.22em 0; position: relative; z-index: 1; text-shadow: 0 0 6px var(--halo, var(--cream)), 0 0 3px var(--halo, var(--cream)); }
</style>
</head>
<body>
<header>
  <div class="title">
    <p>AMASADO DE JALÁ · NOVIEMBRE 2026</p>
    <h1 class="ttl"><span>Deseos</span><em>para</em><span>Nao y Nacho</span></h1>
    <div class="count" id="count"></div>
  </div>
</header>

<main class="wall" id="wall" aria-live="polite"></main>
<p class="empty" id="empty">Todavía no hay deseos. Dejá el primero.</p>

<nav class="join">
  <a class="jbtn main" href="index.html#dejar-deseo">DEJÁ TU DESEO</a>
  <a class="jbtn" href="index.html">VOLVER</a>
</nav>

<script src="deseos-config.js"></script>
<script>
(() => {
  const wall = document.getElementById('wall');
  const notes = new Map();
  let first = true;

  function rand(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

  function makeNote(w, fresh) {
    const el = document.createElement('article');
    el.className = 'note p' + (1 + (w.id % 4)) + (fresh ? ' new' : '');
    el.style.setProperty('--r', ((rand(w.id) - 0.5) * 5).toFixed(2) + 'deg');
    const wish = document.createElement('p'); wish.className = 'wish'; wish.textContent = '“' + w.d + '”';
    const who = document.createElement('p'); who.className = 'who'; who.textContent = '— ' + (w.n || 'Anónimo').toUpperCase();
    el.append(wish, who);
    return el;
  }

  function render(list) {
    document.getElementById('empty').hidden = list.length > 0;
    document.getElementById('count').textContent = list.length ? list.length + (list.length === 1 ? ' DESEO' : ' DESEOS') : '';
    const ids = new Set(list.map((w) => w.id));
    for (const [id, el] of notes) if (!ids.has(id)) { el.remove(); notes.delete(id); } // ocultado desde la planilla
    list.slice().sort((a, b) => a.id - b.id).forEach((w) => { // la más nueva queda arriba
      if (notes.has(w.id)) return;
      const el = makeNote(w, !first);
      wall.prepend(el);
      notes.set(w.id, el);
    });
    first = false;
  }

  async function poll() {
    if (!window.DESEOS_ENDPOINT) return;
    try {
      const r = await fetch(window.DESEOS_ENDPOINT + '?t=' + Date.now());
      render(await r.json());
    } catch (e) { /* sin red: reintenta en el próximo ciclo */ }
  }
  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
